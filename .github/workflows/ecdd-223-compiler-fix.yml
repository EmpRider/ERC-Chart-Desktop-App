name: ECDD-223 compiler diagnostic fix

on:
  push:
    branches:
      - task/ECDD-223-shape-text-size
    paths:
      - .github/workflows/ecdd-223-compiler-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Narrow SDK constant declaration support
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/indicator-authoring/callsite-transform.mjs')
          text = path.read_text()
          old = '''const staticPlotDeclarationOptions = new Set([\n  "key",\n  "title",\n  "style",\n  "direction",\n  "shape",\n  "location",\n  "text",\n  "textColor",\n  "textSize",\n]);'''
          new = '''const literalStringPlotDeclarationOptions = new Set([\n  "key",\n  "title",\n  "style",\n  "direction",\n  "text",\n  "textColor",\n]);\nconst sdkConstantPlotDeclarationOptions = new Set([\n  "shape",\n  "location",\n  "textSize",\n]);\nconst staticPlotDeclarationOptions = new Set([\n  ...literalStringPlotDeclarationOptions,\n  ...sdkConstantPlotDeclarationOptions,\n]);'''
          if old not in text:
              raise SystemExit('static option block not found')
          text = text.replace(old, new, 1)

          old = '''function staticPrimitive(node, bindings) {\n  if (ts.isStringLiteral(node) || ts.isNoSubstitutionTemplateLiteral(node))\n    return node.text;\n  if (ts.isNumericLiteral(node)) return Number(node.text);\n  if (\n    ts.isPrefixUnaryExpression(node) &&\n    node.operator === ts.SyntaxKind.MinusToken &&\n    ts.isNumericLiteral(node.operand)\n  )\n    return -Number(node.operand.text);\n  if (\n    ts.isPropertyAccessExpression(node) &&\n    ts.isIdentifier(node.expression)\n  ) {\n    const imported = bindings.get(node.expression.text);\n    const values =\n      imported === undefined ? undefined : sdkConstantValues[imported];\n    return values?.[node.name.text];\n  }\n  return undefined;\n}'''
          new = '''function staticLiteralPrimitive(node) {\n  if (ts.isStringLiteral(node) || ts.isNoSubstitutionTemplateLiteral(node))\n    return node.text;\n  if (ts.isNumericLiteral(node)) return Number(node.text);\n  if (\n    ts.isPrefixUnaryExpression(node) &&\n    node.operator === ts.SyntaxKind.MinusToken &&\n    ts.isNumericLiteral(node.operand)\n  )\n    return -Number(node.operand.text);\n  return undefined;\n}\n\nfunction staticPrimitive(node, bindings) {\n  const literal = staticLiteralPrimitive(node);\n  if (literal !== undefined) return literal;\n  if (\n    ts.isPropertyAccessExpression(node) &&\n    ts.isIdentifier(node.expression)\n  ) {\n    const imported = bindings.get(node.expression.text);\n    const values =\n      imported === undefined ? undefined : sdkConstantValues[imported];\n    return values?.[node.name.text];\n  }\n  return undefined;\n}'''
          if old not in text:
              raise SystemExit('static primitive block not found')
          text = text.replace(old, new, 1)

          old = '''    const value = staticPrimitive(property.initializer, bindings);\n    if (\n      staticPlotDeclarationOptions.has(name) &&\n      typeof value !== "string"\n    )\n      throw syntaxError(\n        sourceFile,\n        property.initializer,\n        `Plot declaration option "${name}" must use an SDK constant or static string literal.`,\n      );\n    if (value !== undefined) declaration[name] = value;'''
          new = '''    const acceptsSdkConstant = sdkConstantPlotDeclarationOptions.has(name);\n    const value = acceptsSdkConstant\n      ? staticPrimitive(property.initializer, bindings)\n      : staticLiteralPrimitive(property.initializer);\n    if (\n      staticPlotDeclarationOptions.has(name) &&\n      typeof value !== "string"\n    )\n      throw syntaxError(\n        sourceFile,\n        property.initializer,\n        acceptsSdkConstant\n          ? `Plot declaration option "${name}" must use an SDK constant or static string literal.`\n          : `Plot declaration option "${name}" must use a static string literal.`,\n      );\n    if (value !== undefined) declaration[name] = value;'''
          if old not in text:
              raise SystemExit('property validation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/ecdd-223-compiler-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ECDD-223): preserve compiler declaration diagnostics"
          git push origin HEAD:task/ECDD-223-shape-text-size
