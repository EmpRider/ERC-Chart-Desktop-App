name: ECDD-83 one-shot format

on:
  push:
    branches:
      - task/ECDD-83-package-content-policy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format ECDD-83 files
        run: npx prettier --write packages/provider-runtime/src/index.ts packages/provider-runtime/src/package-policy.ts packages/provider-runtime/test/package-policy.test.mjs
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/provider-runtime/src/index.ts packages/provider-runtime/src/package-policy.ts packages/provider-runtime/test/package-policy.test.mjs
          git commit -m "ECDD-83: apply repository formatting"
          git push origin HEAD:task/ECDD-83-package-content-policy
