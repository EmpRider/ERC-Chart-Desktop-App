name: ECDD-218 dependency repair

on:
  push:
    branches:
      - task/ECDD-218-sdk-v2-source-history

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-218-sdk-v2-source-history
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Generate and verify dependency state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'package.json';
          const governancePath = 'tools/delivery-governance/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          const governance = JSON.parse(fs.readFileSync(governancePath, 'utf8'));
          root.scripts['format:check'] = 'prettier --check apps packages docs/development tools/*.mjs tools/application-gates tools/delivery-governance tools/packaging tools/workspace-boundaries .github/workflows package.json tsconfig.base.json tsconfig.tests.json tsconfig.json eslint.config.mjs README.md';
          delete root.overrides;
          governance.scripts['lint:markdown'] = 'node src/markdown-lint.mjs';
          delete governance.devDependencies['markdownlint-cli2'];
          governance.devDependencies.markdownlint = '0.41.1';
          governance.devDependencies['jsonc-parser'] = '3.3.1';
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);
          fs.writeFileSync(governancePath, `${JSON.stringify(governance, null, 2)}\n`);
          NODE
          cat > tools/delivery-governance/src/markdown-lint.mjs <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";
          import { parse } from "jsonc-parser";
          import { formatLintResults } from "markdownlint/helpers";
          import { lint } from "markdownlint/promise";

          const repositoryRoot = path.resolve(process.cwd(), "../..");
          const excludedFiles = new Set([
            ".github/pull_request_template.md",
            "docs/architecture/v1/ARCHITECTURE-DECISIONS.md",
            "docs/architecture/v1/ERC-chart-Architecture-Specification-v1.md",
            "docs/architecture/v1/IMPLEMENTATION-BACKLOG.md",
            "docs/architecture/v1/README.md",
            "docs/architecture/v1/REFERENCE-FEATURE-CATALOG.md",
          ]);
          const excludedDirectories = new Set([".git", "node_modules"]);

          async function collectMarkdownFiles(directory) {
            const files = [];
            const entries = await fs.readdir(directory, { withFileTypes: true });
            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                if (!excludedDirectories.has(entry.name)) {
                  files.push(...(await collectMarkdownFiles(absolutePath)));
                }
                continue;
              }
              if (!entry.isFile() || !entry.name.toLowerCase().endsWith(".md")) {
                continue;
              }
              const relativePath = path
                .relative(repositoryRoot, absolutePath)
                .split(path.sep)
                .join("/");
              if (!excludedFiles.has(relativePath)) {
                files.push(absolutePath);
              }
            }
            return files;
          }

          const configPath = path.join(repositoryRoot, ".markdownlint-cli2.jsonc");
          const parseErrors = [];
          const parsedConfig = parse(await fs.readFile(configPath, "utf8"), parseErrors, {
            allowTrailingComma: true,
          });
          if (parseErrors.length > 0) {
            throw new Error(`Unable to parse ${configPath}: ${JSON.stringify(parseErrors)}`);
          }
          const config = parsedConfig?.config ?? parsedConfig;
          const files = (await collectMarkdownFiles(repositoryRoot)).sort();
          const results = await lint({ files, config });
          const errors = formatLintResults(results);
          if (errors.length > 0) {
            for (const error of errors) {
              console.error(error);
            }
            process.exitCode = 1;
          } else {
            console.log(`Markdown lint passed (${files.length} files).`);
          }
          NODE
          npm install --package-lock-only --ignore-scripts --audit=false
          npm ci --audit=false
          npm run audit:ci
          npm --workspace tools/delivery-governance run lint:markdown
          npm run format:check
          npm run lint
          npm run typecheck
          rm .github/workflows/ecdd-218-dependency-repair.yml
          git diff --check
      - name: Commit generated lock state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tools/delivery-governance/package.json tools/delivery-governance/src/markdown-lint.mjs .github/workflows/ecdd-218-dependency-repair.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'chore(ci): replace vulnerable markdownlint wrapper'
          git push origin HEAD:task/ECDD-218-sdk-v2-source-history
