name: ECDD-225 guarded GREEN patch v3

on:
  push:
    branches:
      - task/ECDD-225-remove-v1-authoring-surface
    paths:
      - .github/workflows/ecdd-225-green-v3.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Apply ECDD-225 GREEN migration
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          replace(
              "packages/indicator-sdk/src/indicator.ts",
              '''import type {
            IndicatorDefinition,
            IndicatorInputDefinition,
            IndicatorInputValue,
            IndicatorInstanceContext,
            IndicatorOverlay,
            IndicatorPlotDefinition,
            IndicatorPluginModule,
            IndicatorResultPoint,
            RuntimeIndicatorInstance,
            SignalCandidate,
          } from "./index.js";''',
              '''import type {
            IndicatorDefinition,
            IndicatorInputDefinition,
            IndicatorInputValue,
            IndicatorOverlay,
            IndicatorPlotDefinition,
            IndicatorResultPoint,
          } from "./index.js";
          import type {
            IndicatorInstanceContext,
            IndicatorPluginModule,
            RuntimeIndicatorInstance,
            SignalCandidate,
          } from "./internal/runtime-contracts.js";''',
          )

          package_path = Path("packages/indicator-sdk/package.json")
          package = json.loads(package_path.read_text())
          package["exports"]["./internal"] = {
              "types": "./dist/internal/index.d.ts",
              "import": "./dist/internal/index.js",
          }
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          replace(
              "packages/indicator-runtime/src/index.ts",
              '} from "@erc-chart/indicator-sdk";\n\nexport function normalizeIndicatorParameters(',
              '} from "@erc-chart/indicator-sdk/internal";\n\nexport function normalizeIndicatorParameters(',
          )
          replace(
              "packages/indicator-runtime/src/worker-entry.ts",
              '} from "@erc-chart/indicator-sdk";\nimport type {\n  IndicatorWorkerDisposeMessage,',
              '} from "@erc-chart/indicator-sdk/internal";\nimport type {\n  IndicatorWorkerDisposeMessage,',
          )

          replace(
              "packages/indicator-examples/src/atr-bands.ts",
              '''  signal,
            ta,
            type IndicatorPluginModule,
          } from "@erc-chart/indicator-sdk";

          const indicator: IndicatorPluginModule = defineIndicator(''',
              '''  signal,
            ta,
            type IndicatorModule,
          } from "@erc-chart/indicator-sdk";

          const indicator: IndicatorModule = defineIndicator(''',
          )

          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''  textSize,
            type DmiPoint,
            type IndicatorBar,
            type IndicatorPluginModule,
          } from "@erc-chart/indicator-sdk";''',
              '''  textSize,
            type DmiPoint,
            type IndicatorBar,
            type IndicatorModule,
          } from "@erc-chart/indicator-sdk";''',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''function cloneZone(zone: PocZone): PocZone {
            return {
              ...zone,
              segments: [...zone.segments],
            };
          }

          ''',
              '',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''  // Retained history is replayed once from a fresh series kernel, so its prior
            // POC state will never be revisited. Reuse those zone objects during replay
            // instead of copying an ever-growing segment history on every candle. Live
            // finalized updates still use copy-on-write state for building-bar rollback.
            let zones = bar.isHistory
              ? [...previous.zones]
              : previous.zones.map(cloneZone);''',
              '''  // series() supplies an isolated candidate state for every update and only
            // commits finalized values, so author code does not need replay-mode flags.
            let zones = [...previous.zones];''',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''  zones = trimZones(zones, params);
            if (bar.isHistory && !bar.isHistoryFinalizedTail) {
              return {
                bars,
                zones,
                ...(current === undefined ? {} : { currentZoneId: current.id }),
                previousScores,
                ...(pendingMigration === undefined ? {} : { pendingMigration }),
              };
            }
            return {''',
              '''  zones = trimZones(zones, params);
            return {''',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''  const skipHistoricalIntermediate =
              bar.isHistory && bar.isConfirmed && !bar.isHistoryFinalizedTail;
            if (skipHistoricalIntermediate) return;
            syncZoneDrawings(''',
              '''  syncZoneDrawings(''',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              'const indicator: IndicatorPluginModule = defineIndicator(\n',
              'const indicator: IndicatorModule = defineIndicator(\n',
          )
          replace(
              "packages/indicator-examples/src/atr-rope-utbot.ts",
              '''export const definition: IndicatorPluginModule["definition"] =
            indicator.definition;
          export const createInstance: IndicatorPluginModule["createInstance"] =
            indicator.createInstance;
          default indicator;''',
              '''export default indicator;''',
          ) if False else None
          source = Path("packages/indicator-examples/src/atr-rope-utbot.ts")
          text = source.read_text()
          old = '''export const definition: IndicatorPluginModule["definition"] =
            indicator.definition;
          export const createInstance: IndicatorPluginModule["createInstance"] =
            indicator.createInstance;
          export default indicator;'''
          if text.count(old) != 1:
              raise SystemExit("atr-rope-utbot.ts: expected named runtime exports once")
          source.write_text(text.replace(old, "export default indicator;"))

          replace(
              "packages/indicator-sdk/test/ta.test.mjs",
              '''import {
            candlesWithPriceSource,
            createAtrKernel,
            createCrossoverKernel,
            createHighestKernel,
            createLowestKernel,
            createRsiKernel,
            movingAverage,
            movingAverageTypes,
            priceSeries,
            ta,
          } from "../dist/index.js";''',
              '''import { movingAverageTypes, ta } from "../dist/index.js";
          import {
            candlesWithPriceSource,
            createAtrKernel,
            createCrossoverKernel,
            createHighestKernel,
            createLowestKernel,
            createRsiKernel,
            movingAverage,
            priceSeries,
          } from "../dist/internal/index.js";''',
          )

          fixture = Path("packages/indicator-sdk/test/indicator-sdk.types.ts")
          text = fixture.read_text()
          text = text.replace('import type { InstrumentId, TimeframeId } from "@erc-chart/contracts";\n', '')
          text = text.replace('  type IndicatorInstance,\n', '')
          text = text.replace('  type SignalCandidate,\n', '')
          start = text.index('export const instance:')
          text = text[:start].rstrip() + "\n"
          fixture.write_text(text)
      - name: Format changed sources
        run: >-
          npx prettier --write
          packages/indicator-sdk/src/index.ts
          packages/indicator-sdk/src/internal/index.ts
          packages/indicator-sdk/src/internal/runtime-contracts.ts
          packages/indicator-sdk/src/indicator.ts
          packages/indicator-sdk/package.json
          packages/indicator-runtime/src/index.ts
          packages/indicator-runtime/src/worker-entry.ts
          packages/indicator-examples/src/atr-bands.ts
          packages/indicator-examples/src/atr-rope-utbot.ts
          packages/indicator-sdk/test/ta.test.mjs
          packages/indicator-sdk/test/indicator-sdk.types.ts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:legacy-indicators
      - name: Commit guarded GREEN patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/indicator-sdk packages/indicator-runtime packages/indicator-examples
          git diff --cached --quiet && exit 1
          git commit -m "ECDD-225: finalize v2-only public SDK surface"
          git push origin HEAD:${GITHUB_REF_NAME}
