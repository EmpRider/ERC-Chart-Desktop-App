name: ECDD-142 RED formatter

on:
  push:
    branches:
      - task/ECDD-142-provider-driven-mtf
    paths:
      - .github/workflows/ecdd-142-red-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-142-provider-driven-mtf
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts --audit=false
      - run: npx prettier --write packages/data-service/test/indicator-timeframes.test.mjs
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/data-service/test/indicator-timeframes.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format ECDD-142 RED fixture"
            git push origin HEAD:task/ECDD-142-provider-driven-mtf
          fi
