name: ECDD-225 public surface audit 3

on:
  push:
    branches:
      - task/ECDD-225-remove-v1-authoring-surface

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit SDK consumers and v1 surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ROOT SDK IMPORTS ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist '@erc-chart/indicator-sdk' apps packages tools || true
          echo '=== CANDIDATE V1 / INTERNAL SYMBOL USAGE ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist '\b(appendSeries|laggedValue|series|candlesWithPriceSource|priceSeries|priceValue|inputOptions|maxSeriesCollectionItems|priceSources|IndicatorSnapshot|IndicatorPluginModule|RuntimeIndicatorInstance|IndicatorInstanceContext|IndicatorInstance|IndicatorResultPoint|IndicatorOverlay|SignalCandidate|normalizeIndicatorInputValue|normalizeIndicatorParameters|createAtrKernel|createDmiKernel|createRsiKernel|createHighestKernel|createLowestKernel|createCrossoverKernel|createCrossunderKernel|createMovingAverageKernel)\b' apps packages tools || true
          echo '=== MAINTAINED EXAMPLE IMPORTS ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist '^import|@erc-chart/indicator-sdk|\b(appendSeries|laggedValue|series|create[A-Z].*Kernel|normalizeIndicator)\b' packages/indicator-examples || true
