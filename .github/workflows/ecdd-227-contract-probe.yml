name: ECDD-227 contract fixture probe

on:
  push:
    branches:
      - task/ECDD-227-contract-fixtures

jobs:
  verify-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts --fund=false --audit=false
      - name: Check formatting
        run: npx --no-install prettier --check tools/indicator-v2-contract-fixtures.test.mjs
      - name: Build workspace
        run: npm run build
      - name: Run composed SDK v2 contract fixture
        run: node --test tools/indicator-v2-contract-fixtures.test.mjs
