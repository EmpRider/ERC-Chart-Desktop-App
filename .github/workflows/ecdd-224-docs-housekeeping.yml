name: ECDD-224 post-task docs housekeeping

on:
  push:
    branches:
      - task/ECDD-224-post-task-docs

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Apply ECDD-224 reassessment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const currentStatePath = 'docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md';
          const planPath = 'docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md';

          function replaceLine(path, startsWith, replacement) {
            const lines = fs.readFileSync(path, 'utf8').split('\n');
            const matches = lines.reduce((count, line) => count + (line.startsWith(startsWith) ? 1 : 0), 0);
            if (matches !== 1) throw new Error(`${path}: expected exactly one line starting with ${startsWith}, found ${matches}`);
            const next = lines.map((line) => (line.startsWith(startsWith) ? replacement : line)).join('\n');
            fs.writeFileSync(path, next);
          }

          replaceLine(
            currentStatePath,
            '| Maintained examples',
            '| Maintained examples         | ECDD-224 completed the ATR Rope/UT Bot rewrite on SDK v2: hidden compiler-owned input/plot/drawing/signal identity, SDK history, semantic BUY/SELL markers, and drawing-handle cleanup; POC/profile/follow/MG domain state remains explicit. | Preserve this v2-only maintained source as the migration fixture; ECDD-228 owns the broader equivalent-candle regression matrix. | Complete (ECDD-224); ECDD-228 |',
          );
          replaceLine(
            currentStatePath,
            '7. **Example migration — ECDD-224.',
            '7. **Example migration — ECDD-224 (complete).** ATR Rope and UT Bot now use the final v2 authoring surface; all four characterized output/signal hashes remain preserved. ECDD-228 owns the broader migration regression matrix.',
          );
          replaceLine(
            planPath,
            '- [ ] Phase 14 — Rewrite maintained indicators against SDK v2',
            '- [x] Phase 14 — Rewrite maintained indicators against SDK v2',
          );
          replaceLine(
            planPath,
            '**Optimization sequencing note (2026-09-13):**',
            '**Optimization sequencing note (2026-09-13):** ECDD-222 maps to detailed Task 7 and is complete. ECDD-223 maps to detailed Task 8 and is complete via PR #129 / squash merge `de7262ea3723530d546df017c2ac2eed14f9250f`. ECDD-224 completed the maintained ATR Rope/UT Bot rewrite via PR #131 / squash merge `e8c94027e40e0a24be1070a588ca93b097220687`, preserving all four characterized trading-semantic hashes while removing v1.5 authoring/runtime plumbing without a compatibility shim. ECDD-225 (v1 authoring-surface removal and public-export cleanup) is next. The broader phase board groups source/runtime/renderer work at architecture level and does not override the ECDD-216 Jira task order.',
          );
          NODE
      - name: Format reassessment docs
        run: |
          npm ci --ignore-scripts --audit=false
          npx prettier --write docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          npx prettier --check docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
      - name: Commit and push docs only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!.github/workflows/ecdd-224-docs-housekeeping.yml' || true
          git status --short
          git add docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          git diff --cached --quiet && { echo 'Expected docs changes were not produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ECDD-224): record SDK v2 rewrite reassessment'
          git push origin HEAD:task/ECDD-224-post-task-docs
