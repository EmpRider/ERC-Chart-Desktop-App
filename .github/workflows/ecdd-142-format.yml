name: ECDD-142 format

on:
  push:
    branches:
      - task/ECDD-142-provider-driven-mtf

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci --audit=false
      - run: npx prettier --write packages/indicator-runtime/src/source-engine.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/indicator-runtime/src/source-engine.ts
          git commit -m "style(indicators): format source engine"
          git push
