name: ECDD-223 one-shot format

on:
  push:
    branches:
      - task/ECDD-223-shape-text-size
    paths:
      - .github/workflows/ecdd-223-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
          check-latest: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --audit=false
      - name: Format ECDD-223 files
        run: >-
          npx prettier --write
          packages/contracts/src/indicator-management.ts
          packages/indicator-sdk/src/plot.ts
          packages/renderer/src/indicator-shape-style.ts
          tools/indicator-authoring-callsite-transform.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/indicator-management.ts packages/indicator-sdk/src/plot.ts packages/renderer/src/indicator-shape-style.ts tools/indicator-authoring-callsite-transform.test.mjs
          git commit -m "style(ECDD-223): format shape text changes"
          git push origin HEAD:task/ECDD-223-shape-text-size
