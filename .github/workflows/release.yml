name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Verify exact release source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") {
            throw "Release checkout does not match the triggering commit."
          }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run smoke:multi-instance
      - run: npm run test:performance
      - run: npm run audit:ci
      - run: npm run version:check
      - run: npm run package:win
      - run: npm run smoke:installer
      - run: npm run checksum:installer
      - name: Publish verified draft transaction
        run: node tools/packaging/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
