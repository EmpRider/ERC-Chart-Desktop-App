name: ECDD-225 workspace boundary fix

on:
  push:
    branches:
      - task/ECDD-225-remove-v1-authoring-surface
    paths:
      - .github/workflows/ecdd-225-boundary-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Apply workspace-compliant internal boundary
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          package_path = Path("packages/indicator-sdk/package.json")
          package = json.loads(package_path.read_text())
          package["exports"] = {".": package["exports"]["."]}
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          Path("packages/indicator-sdk/src/internal/index.ts").unlink()

          runtime = Path("packages/indicator-runtime/src/index.ts")
          text = runtime.read_text()
          old = '''  IndicatorParameterValues,
            IndicatorRuntimeOverlay,
            IndicatorRuntimePoint,
            IndicatorRuntimeSignal,
            IndicatorRuntimeSnapshot,
            InstalledIndicatorDefinition,
          } from "@erc-chart/contracts";
          import {
            normalizeIndicatorParameters as normalizeSdkIndicatorParameters,
            type IndicatorInputDefinition,
          } from "@erc-chart/indicator-sdk/internal";

          export function normalizeIndicatorParameters(
            definition: InstalledIndicatorDefinition,
            supplied: Readonly<Record<string, unknown>>,
          ): IndicatorParameterValues {
            return normalizeSdkIndicatorParameters(
              definition.inputs as readonly IndicatorInputDefinition[],
              supplied,
            );
          }
          '''
          new = '''  IndicatorParameterValue,
            IndicatorParameterValues,
            IndicatorRuntimeOverlay,
            IndicatorRuntimePoint,
            IndicatorRuntimeSignal,
            IndicatorRuntimeSnapshot,
            InstalledIndicatorDefinition,
            InstalledIndicatorInputDefinition,
          } from "@erc-chart/contracts";

          function stepDecimals(step: number): number {
            const text = `${step}`.toLowerCase();
            if (text.includes("e-")) {
              const [coefficient = "", exponent = "0"] = text.split("e-");
              const fraction = coefficient.split(".")[1]?.length ?? 0;
              return Math.min(20, fraction + Number(exponent));
            }
            return Math.min(20, text.split(".")[1]?.length ?? 0);
          }

          function normalizeIndicatorInputValue(
            definition: InstalledIndicatorInputDefinition,
            value: unknown,
          ): IndicatorParameterValue {
            if (definition.type === "boolean")
              return typeof value === "boolean" ? value : definition.defaultValue;
            if (definition.type === "number") {
              const raw =
                typeof value === "number" && Number.isFinite(value)
                  ? value
                  : definition.defaultValue;
              const bounded = Math.min(
                definition.max ?? raw,
                Math.max(definition.min ?? raw, raw),
              );
              if (definition.step === undefined) return bounded;
              return Number(bounded.toFixed(stepDecimals(definition.step)));
            }
            if (typeof value !== "string" || value.length > 8_192)
              return definition.defaultValue;
            if (
              definition.options !== undefined &&
              !definition.options.some((option) => option.value === value)
            )
              return definition.defaultValue;
            return value;
          }

          export function normalizeIndicatorParameters(
            definition: InstalledIndicatorDefinition,
            supplied: Readonly<Record<string, unknown>>,
          ): IndicatorParameterValues {
            return Object.freeze(
              Object.fromEntries(
                definition.inputs.map((input) => [
                  input.key,
                  normalizeIndicatorInputValue(input, supplied[input.key]),
                ]),
              ),
            );
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("indicator-runtime/src/index.ts: expected internal SDK normalization import once")
          runtime.write_text(text.replace(old, new))

          worker = Path("packages/indicator-runtime/src/worker-entry.ts")
          text = worker.read_text()
          old = '''import {
            normalizeIndicatorParameters,
            type IndicatorInputDefinition,
            type IndicatorInputValue,
            type IndicatorPluginModule,
            type RuntimeIndicatorInstance,
          } from "@erc-chart/indicator-sdk/internal";
          import type {
          '''
          new = '''import type {
          '''
          if text.count(old) != 1:
              raise SystemExit("worker-entry.ts: expected SDK internal import once")
          text = text.replace(old, new)
          text = text.replace(
            '''  IndicatorWorkerSyncMessage,
          } from "./index.js";''',
            '''  IndicatorWorkerSyncMessage,
          } from "./index.js";
          import { normalizeIndicatorParameters } from "./index.js";''',
          )
          marker = '''import { assertDenseSnapshotTimeline } from "./result-validation.js";

          interface ActiveInstance {'''
          inserted = '''import { assertDenseSnapshotTimeline } from "./result-validation.js";

          interface RuntimeIndicatorSnapshot extends IndicatorRuntimeSnapshot {
            readonly visualRevision?: number;
          }

          interface RuntimeIndicatorInstance {
            readonly onHistory: (candles: readonly Candle[]) => void;
            readonly onBuildingBar: (candle: Candle) => void;
            readonly onFinalizedBar: (candle: Candle) => void;
            readonly dispose: () => void;
            readonly snapshot: () => RuntimeIndicatorSnapshot;
          }

          interface IndicatorPluginModule {
            readonly definition: InstalledIndicatorDefinition;
            readonly createInstance: (
              parameters: IndicatorParameterValues,
              context: {
                readonly instrumentId: InstrumentId;
                readonly timeframeId: TimeframeId;
              },
            ) => RuntimeIndicatorInstance;
          }

          interface ActiveInstance {'''
          if text.count(marker) != 1:
              raise SystemExit("worker-entry.ts: expected ActiveInstance marker once")
          text = text.replace(marker, inserted)
          text = text.replace(
            '''function normalizeParameters(
            definition: InstalledIndicatorDefinition,
            supplied: IndicatorParameterValues,
          ): Readonly<Record<string, IndicatorInputValue>> {
            return normalizeIndicatorParameters(
              definition.inputs as readonly IndicatorInputDefinition[],
              supplied,
            );
          }''',
            '''function normalizeParameters(
            definition: InstalledIndicatorDefinition,
            supplied: IndicatorParameterValues,
          ): IndicatorParameterValues {
            return normalizeIndicatorParameters(definition, supplied);
          }''',
          )
          text = text.replace(
            '  parameters: Readonly<Record<string, IndicatorInputValue>>,\n',
            '  parameters: IndicatorParameterValues,\n',
          )
          worker.write_text(text)

          test_file = Path("packages/indicator-sdk/test/ta.test.mjs")
          text = test_file.read_text()
          old = '''import { movingAverageTypes, ta } from "../dist/index.js";
          import {
            candlesWithPriceSource,
            createAtrKernel,
            createCrossoverKernel,
            createHighestKernel,
            createLowestKernel,
            createRsiKernel,
            movingAverage,
            priceSeries,
          } from "../dist/internal/index.js";'''
          new = '''import { movingAverageTypes, ta } from "../dist/index.js";
          import { candlesWithPriceSource, priceSeries } from "../dist/series.js";
          import {
            createAtrKernel,
            createCrossoverKernel,
            createHighestKernel,
            createLowestKernel,
            createRsiKernel,
            movingAverage,
          } from "../dist/ta.js";'''
          if text.count(old) != 1:
              raise SystemExit("ta.test.mjs: expected internal barrel import once")
          test_file.write_text(text.replace(old, new))
      - name: Format changed sources
        run: >-
          npx prettier --write
          packages/indicator-sdk/package.json
          packages/indicator-runtime/src/index.ts
          packages/indicator-runtime/src/worker-entry.ts
          packages/indicator-sdk/test/ta.test.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:legacy-indicators
      - run: node --test tools/atr-rope-utbot-v2-migration.test.mjs
      - name: Commit guarded boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/indicator-sdk packages/indicator-runtime
          git diff --cached --quiet && exit 1
          git commit -m "ECDD-225: keep runtime internals behind workspace boundary"
          git push origin HEAD:${GITHUB_REF_NAME}
