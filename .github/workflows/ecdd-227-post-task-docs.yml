name: ECDD-227 post-task reassessment

on:
  push:
    branches:
      - task/ECDD-227-post-task-docs

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts --fund=false --audit=false
      - name: Apply ECDD-227 reassessment
        run: |
          python - <<'PY'
          from pathlib import Path

          current = Path('docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md')
          lines = current.read_text(encoding='utf-8').splitlines()
          updated = []
          for line in lines:
              if line.startswith('| Renderer orchestration'):
                  updated.append('| Renderer orchestration      | `packages/renderer/src/indicator-worker-runtime.ts` retries with a rebuild when the worker requires a snapshot and rejects stale data/config generations.                                                                                                                                                                 | Recovery/generation safety remains preserved. ECDD-223 completed semantic shape text/location/text-size mapping; ECDD-227 now provides the final composed v2 contract fixture across replay/provisional/finalized lifecycle behavior.                                         | Complete (ECDD-227); ECDD-228 next                     |')
              elif line.startswith('| Contract tests'):
                  updated.append('| Contract tests              | SDK/runtime/compiler coverage now includes stable hidden plot/signal identity, conditional stateful execution, `close[1]` / `close.at(1)` / `history(close, 1)` parity, provisional rollback, finalized advancement, and drawing reconciliation through a packaged-indicator fixture. | ECDD-227 complete via PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce`. ECDD-228 owns maintained ATR Rope/UT Bot migration-regression depth; provider/MTF source acceptance remains with ECDD-142. | Complete (ECDD-227); ECDD-228, ECDD-142 boundary       |')
              else:
                  updated.append(line)
          text = '\n'.join(updated) + '\n'
          old = '10. **Contract fixtures — ECDD-227.** Lock identity, conditional execution, history parity, provisional rollback, finalized advancement, and drawing reconciliation; provider/MTF source acceptance stays with ECDD-142.'
          new = '10. **Contract fixtures — ECDD-227 (complete).** PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce` locks hidden identity, conditional execution, history parity, provisional rollback, finalized advancement, and drawing reconciliation through the packaged authoring path; provider/MTF source acceptance stays with ECDD-142.'
          if old not in text:
              raise SystemExit('current-state ECDD-227 gap record not found')
          current.write_text(text.replace(old, new), encoding='utf-8')

          plan = Path('docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md')
          plan_lines = plan.read_text(encoding='utf-8').splitlines()
          replacement = '**Optimization sequencing note (2026-09-13):** ECDD-222 maps to detailed Task 7 and is complete. ECDD-223 maps to detailed Task 8 and is complete via PR #129 / squash merge `de7262ea3723530d546df017c2ac2eed14f9250f`. ECDD-224 completed the maintained ATR Rope/UT Bot rewrite via PR #131 / squash merge `e8c94027e40e0a24be1070a588ca93b097220687`, preserving the four compiled-package trading-semantic regression configurations while moving runtime plumbing to SDK v2. ECDD-225 completed the v1-only public authoring/runtime export cleanup via PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0`, leaving a v2-only author root while keeping required host/runtime mechanisms internal. ECDD-226 completed the final v2-only authoring guide via PR #135 / squash merge `a4ece67f7b9aa077108fd27e777b6c1b92374ae3`, with provider-aware MTF/per-TA execution explicitly retained under ECDD-142 ownership. ECDD-227 completed the final composed v2 contract fixture via PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce`, covering hidden identity, conditional execution, history syntax parity, provisional rollback, finalized advancement, drawing reconciliation, and stable finalized signal identity through the packaged authoring path. ECDD-228 (ATR Rope/UT Bot migration regression expansion) is the next SDK-v2 optimization task. Phase 16 remains open until ECDD-228 and ECDD-229 acceptance work is complete. The broader phase board groups source/runtime/renderer work at architecture level and does not override the ECDD-216 Jira task order.'
          found = False
          for i, line in enumerate(plan_lines):
              if line.startswith('**Optimization sequencing note (2026-09-13):**'):
                  plan_lines[i] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit('implementation-plan sequencing note not found')
          plan.write_text('\n'.join(plan_lines) + '\n', encoding='utf-8')
          PY
      - name: Format reassessment docs
        run: npx --no-install prettier --write docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
      - name: Verify reassessment scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md'
          git diff --name-only | grep -Fx 'docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md'
      - name: Commit and push reassessment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          git commit -m 'docs(ECDD-227): record SDK v2 contract acceptance'
          git push origin HEAD:task/ECDD-227-post-task-docs
