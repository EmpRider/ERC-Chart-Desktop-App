name: Generate governance lockfile

on:
  push:
    branches:
      - bootstrap/delivery-governance
    paths:
      - tools/delivery-governance/package.json
      - .github/workflows/generate-governance-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Generate lockfile
        run: npm install --prefix tools/delivery-governance --package-lock-only --ignore-scripts
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-lockfile
          path: tools/delivery-governance/package-lock.json
          if-no-files-found: error
          retention-days: 1
