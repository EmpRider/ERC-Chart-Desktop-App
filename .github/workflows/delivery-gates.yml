name: Delivery gates

on:
  pull_request:
    branches:
      - main
      - "epic/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read

concurrency:
  group: delivery-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-24.04
    outputs:
      application_present: ${{ steps.application.outputs.application_present }}
      docs_only: ${{ steps.context.outputs.docs_only }}
      governance_only: ${{ steps.context.outputs.governance_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install governance dependencies
        run: npm ci --ignore-scripts --audit=false
      - name: Build pull-request context
        id: context
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          [[ "$PR_BASE_SHA" =~ $sha_pattern ]]
          [[ "$PR_HEAD_SHA" =~ $sha_pattern ]]
          if git merge-base --is-ancestor "$PR_BASE_SHA" "$PR_HEAD_SHA"; then
            echo "base_is_ancestor=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_is_ancestor=false" >> "$GITHUB_OUTPUT"
          fi

          mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
          docs_only=false
          governance_only=false
          if ((${#changed_files[@]} > 0)); then
            docs_only=true
            governance_only=true
            for file in "${changed_files[@]}"; do
              case "$file" in
                docs/*|*.md|*.mdx) ;;
                *) docs_only=false ;;
              esac
              case "$file" in
                .github/workflows/delivery-gates.yml|tools/delivery-governance/*) ;;
                *) governance_only=false ;;
              esac
            done
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "governance_only=$governance_only" >> "$GITHUB_OUTPUT"

          {
            echo 'changed_files<<EOF'
            if ((${#changed_files[@]} > 0)); then
              printf '%s\n' "${changed_files[@]}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Test governance tool
        run: npm --workspace @erc-chart/delivery-governance test
      - name: Validate pull-request contract
        env:
          PR_BASE_IS_ANCESTOR: ${{ steps.context.outputs.base_is_ancestor }}
          PR_CHANGED_FILES: ${{ steps.context.outputs.changed_files }}
        run: npm --workspace @erc-chart/delivery-governance run validate:pr
      - name: Validate repository
        run: npm --workspace @erc-chart/delivery-governance run validate:repository
      - name: Lint Markdown
        run: npm --workspace @erc-chart/delivery-governance run lint:markdown
      - name: Verify administration dry run
        run: node tools/delivery-governance/src/github-admin.mjs
      - name: Detect application contract
        id: application
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { validateApplicationContract } from "./tools/delivery-governance/src/application-contract.mjs";
          const result = await validateApplicationContract(process.cwd());
          for (const error of result.errors) console.error(error);
          if (result.errors.length) process.exit(1);
          console.error(result.message);
          console.log(`application_present=${result.applicationPresent}`);
          NODE

  application-windows:
    name: Application / Windows
    needs: governance
    if: >-
      needs.governance.outputs.application_present == 'true' &&
      needs.governance.outputs.docs_only != 'true' &&
      needs.governance.outputs.governance_only != 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - run: npm ci --audit=false
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run smoke:electron
      - run: npm run build
      - run: npm run smoke:workspace-restart
      - run: npm run smoke:multi-instance
      - run: npm run test:performance
      - run: npm run audit:ci
      - run: npm run version:check
      - name: Package Windows installer
        if: startsWith(github.head_ref, 'epic/') && github.base_ref == 'main'
        run: npm run package:win
      - name: Smoke Windows installer
        if: startsWith(github.head_ref, 'epic/') && github.base_ref == 'main'
        run: npm run smoke:installer

  delivery-gates:
    name: Delivery gates
    if: always()
    needs:
      - governance
      - application-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Aggregate required results
        shell: bash
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          APPLICATION_WINDOWS_RESULT: ${{ needs.application-windows.result }}
          APPLICATION_PRESENT: ${{ needs.governance.outputs.application_present == 'true' && needs.governance.outputs.docs_only != 'true' && needs.governance.outputs.governance_only != 'true' }}
          APPLICATION_CONTRACT_PRESENT: ${{ needs.governance.outputs.application_present }}
          DOCS_ONLY: ${{ needs.governance.outputs.docs_only }}
          GOVERNANCE_ONLY: ${{ needs.governance.outputs.governance_only }}
          EPIC_TO_MAIN: ${{ startsWith(github.head_ref, 'epic/') && github.base_ref == 'main' }}
        run: |
          set -euo pipefail
          node tools/delivery-governance/src/aggregate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
