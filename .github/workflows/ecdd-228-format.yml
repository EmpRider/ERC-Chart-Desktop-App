name: ECDD-228 format fixture

on:
  push:
    branches:
      - task/ECDD-228-atr-rope-utbot-regressions

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-228-atr-rope-utbot-regressions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts --audit=false
      - run: npx prettier --write tools/atr-rope-utbot-v2-regressions.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/atr-rope-utbot-v2-regressions.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/atr-rope-utbot-v2-regressions.test.mjs
          git commit -m "chore: format ECDD-228 regression fixture"
          git push origin HEAD:task/ECDD-228-atr-rope-utbot-regressions
