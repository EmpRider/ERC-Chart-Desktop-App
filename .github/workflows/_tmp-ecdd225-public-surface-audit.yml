name: ECDD-225 public surface audit

on:
  push:
    branches:
      - task/ECDD-225-remove-v1-authoring-surface

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit SDK consumers and v1 surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ROOT SDK IMPORTS ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' 'from ["'"']@erc-chart/indicator-sdk["'"']|import\(["'"']@erc-chart/indicator-sdk["'"']\)' apps packages tools || true
          echo '=== CANDIDATE V1 / INTERNAL SYMBOL USAGE ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' '\b(appendSeries|laggedValue|series|candlesWithPriceSource|priceSeries|priceValue|inputOptions|maxSeriesCollectionItems|priceSources|IndicatorSnapshot|IndicatorPluginModule|RuntimeIndicatorInstance|IndicatorInstanceContext|IndicatorInstance|IndicatorResultPoint|IndicatorOverlay|SignalCandidate|normalizeIndicatorInputValue|normalizeIndicatorParameters|createAtrKernel|createDmiKernel|createRsiKernel|createHighestKernel|createLowestKernel|createCrossoverKernel|createCrossunderKernel|createMovingAverageKernel)\b' apps packages tools || true
          echo '=== MAINTAINED EXAMPLE IMPORTS ==='
          rg -n '^import|@erc-chart/indicator-sdk|\b(appendSeries|laggedValue|series|create[A-Z].*Kernel|normalizeIndicator)\b' packages/indicator-examples || true
          echo '=== SDK ROOT EXPORT DECLARATIONS ==='
          sed -n '1,260p' packages/indicator-sdk/src/index.ts
