name: ECDD-227 contract fixture formatter

on:
  push:
    branches:
      - task/ECDD-227-contract-fixtures

permissions:
  contents: write

jobs:
  format-contract-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts --fund=false --audit=false
      - name: Format contract fixture
        run: npx --no-install prettier --write tools/indicator-v2-contract-fixtures.test.mjs
      - name: Verify formatting scope
        run: |
          git diff --check
          git diff --exit-code -- docs/development/INDICATOR-AUTHORING.md
          git diff -- tools/indicator-v2-contract-fixtures.test.mjs
      - name: Commit and push formatting fix
        run: |
          git diff --quiet -- tools/indicator-v2-contract-fixtures.test.mjs && { echo 'No formatting change produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/indicator-v2-contract-fixtures.test.mjs
          git commit -m 'style(ECDD-227): format contract fixture'
          git push origin HEAD:task/ECDD-227-contract-fixtures
