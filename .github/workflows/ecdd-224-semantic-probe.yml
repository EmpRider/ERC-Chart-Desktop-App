name: ECDD-224 semantic fixture probe

on:
  push:
    branches:
      - tmp/ECDD-224-semantic-probe
    paths:
      - .github/workflows/ecdd-224-semantic-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-224-rewrite-atr-rope-utbot
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
          check-latest: false
      - name: Set up pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci --audit=false
      - name: Build current maintained indicator baseline
        run: npm run build
      - name: Capture semantic fixture
        run: |
          node --input-type=module <<'NODE'
          import { atrRopeUtBotIndicator as indicator } from './packages/indicator-examples/dist/index.js';

          const defaults = (overrides = {}) => ({
            ...Object.fromEntries(indicator.definition.inputs.map((input) => [input.key, input.defaultValue])),
            ...overrides,
          });

          function candles(length = 180) {
            const result = [];
            let previous = 100;
            for (let index = 0; index < length; index += 1) {
              const regime =
                index < 45
                  ? index * 0.16
                  : index < 90
                    ? (90 - index) * 0.21 + 2
                    : index < 135
                      ? (index - 90) * 0.24 - 3
                      : (180 - index) * 0.18 + 4;
              const wave = Math.sin(index / 2.7) * 0.55 + Math.cos(index / 7.5) * 0.28;
              const close = 100 + regime + wave;
              const open = previous;
              result.push({
                instrumentId: 'fixture.instrument',
                timeframeId: '1m',
                openTimeMs: 1_900_000_000_000 + index * 60_000,
                open,
                high: Math.max(open, close) + 0.22 + (index % 5) * 0.015,
                low: Math.min(open, close) - 0.19 - (index % 3) * 0.02,
                close,
                volume: 100 + index,
              });
              previous = close;
            }
            return result;
          }

          const source = candles();
          const plotKey = (label) => {
            const plot = indicator.definition.plots.find((value) => value.label === label);
            if (!plot) throw new Error(`Missing plot label ${label}`);
            return plot.outputKey ?? plot.key;
          };
          const labels = ['ATR Rope', 'Direction Upper', 'Direction Lower', 'UT Stop', 'Buy', 'Sell'];
          const keys = Object.fromEntries(labels.map((label) => [label, plotKey(label)]));
          const round = (value) =>
            typeof value === 'number' && Number.isFinite(value) ? Number(value.toFixed(8)) : value;
          const normalizeOverlay = ({ id: _id, ...overlay }) =>
            Object.fromEntries(Object.entries(overlay).map(([key, value]) => [key, round(value)]));
          const normalizePoint = (point) => ({
            openTimeMs: point.openTimeMs,
            values: Object.fromEntries(labels.map((label) => [label, round(point.values[keys[label]] ?? null)])),
          });
          const cases = [
            ['original', {}],
            ['momentum-zerolag', {
              ropePeriod: 5,
              ropeSensitivityMode: 'momentum',
              ropeDirectionLookback: 4,
              ropeDirectionThreshold: 0.03,
              ropeDirectionMaType: 'tema',
              utbotAtrPeriod: 4,
              utbotMode: '0lag',
              dmiLength: 5,
              profilePeriod: 24,
              fastPocPeriod: 8,
              minEarlyBars: 5,
            }],
            ['adaptive-suppressed', {
              ropePeriod: 7,
              ropeSensitivityMode: 'adaptive',
              ropeDirectionLookback: 3,
              ropeDirectionThreshold: 0.02,
              utbotAtrPeriod: 5,
              pocBandSignalSuppressLine: 'Any',
              dmiLength: 5,
              profilePeriod: 24,
              fastPocPeriod: 8,
              minEarlyBars: 5,
            }],
            ['follow-mg', {
              ropePeriod: 4,
              ropeDirectionLookback: 2,
              ropeDirectionThreshold: 0,
              utbotAtrPeriod: 3,
              signalIssueMode: 'Win Follow + MG Follow',
              mgStepCount: 2,
              dmiLength: 4,
              profilePeriod: 20,
              fastPocPeriod: 6,
              minEarlyBars: 4,
            }],
          ];

          const fixture = {};
          for (const [name, overrides] of cases) {
            const instance = indicator.createInstance(defaults(overrides), {
              instrumentId: 'fixture.instrument',
              timeframeId: '1m',
            });
            try {
              instance.onHistory(source);
              const snapshot = instance.snapshot();
              fixture[name] = {
                tail: snapshot.points.slice(-10).map(normalizePoint),
                signals: (snapshot.signals ?? []).slice(-12).map(({ direction, occurredAtMs }) => ({ direction, occurredAtMs })),
                overlayCount: snapshot.overlays.length,
                overlayTail: snapshot.overlays.slice(-8).map(normalizeOverlay),
              };
            } finally {
              instance.dispose();
            }
          }

          console.log('ECDD224_SEMANTIC_FIXTURE_START');
          console.log(JSON.stringify(fixture, null, 2));
          console.log('ECDD224_SEMANTIC_FIXTURE_END');
          NODE
