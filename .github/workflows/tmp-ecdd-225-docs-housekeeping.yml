name: Temporary ECDD-225 docs housekeeping

on:
  push:
    branches:
      - task/ECDD-225-post-task-docs

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-225-post-task-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
      - run: npm install --global npm@12.0.2
      - run: npm ci --audit=false
      - name: Apply reassessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current = Path('docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md')
          text = current.read_text(encoding='utf-8')
          replacements = {
            '`packages/indicator-sdk/src/index.ts` exports the scalar authoring API together with legacy/runtime-facing types and array-oriented helpers.': '`packages/indicator-sdk/src/index.ts` now exports only the SDK v2 authoring facade. Runtime snapshots/instances, host normalization, array-history compatibility helpers, flat TA/kernel APIs, and author lifecycle bookkeeping are absent from the public root.',
            'Replace with a v2-only public surface. Runtime-only contracts must stay internal.': 'ECDD-225 complete: the public root is v2-only; host/runtime mechanisms remain package-private or live behind the indicator-runtime boundary without a compatibility export path.',
            'ECDD-225, ECDD-226': 'Complete (ECDD-225); authoring docs ECDD-226',
            '`input.ts` discovers inputs by index and defaults persistence keys to `input_<index>`; authors can supply explicit keys. Parameter normalization already handles missing/stale/invalid values safely.': '`input.ts` uses compiler-generated hidden identity for author inputs; public input options no longer expose persistence keys. Host parameter normalization remains runtime-owned and handles missing/stale/invalid values safely.',
            'Keep normalization. Replace declaration-order persistence with compiler-generated stable identity and remove normal author-written keys.': 'ECDD-225 complete for the public boundary: persistence identity is compiler/SDK-owned and normalization is host/runtime-owned.',
            '`series.ts` exposes current-candle price helpers plus `series`, `appendSeries`, and `laggedValue`; maintained complex indicators keep their own bounded history arrays. There is no canonical `close[1]`, `close.at(1)`, or `history(close, 1)` source-history contract.': '`series.ts` exposes the v2 recurrence/history facade (`series`, `history`, compiler-lowered series history) while legacy `appendSeries`/`laggedValue` helpers are no longer available from the author-facing root. Maintained ATR Rope/UT Bot uses SDK-managed history/state instead of lag-only author buffers.',
            'Blocking v2 gap. Add one canonical committed/provisional history engine and compiler history lowering. Keep the source abstraction compatible with the provider/MTF source engine delivered by ECDD-142.': 'The canonical committed/provisional history path and compiler lowering are in place for the optimization scope; keep the source abstraction compatible with provider/MTF acquisition delivered by ECDD-142.',
            '`signal.ts` emits finalized-only signals, which is a useful correctness foundation. Default identity is `signal_<index>` and explicit author IDs are supported.': '`signal.ts` keeps finalized-only signal emission while identity is SDK/compiler-owned; the v2 author surface does not require or expose persistence IDs.',
            'Preserve finalized-only lifecycle; generate stable identity internally and permit conditional calls.': 'Finalized-only lifecycle and hidden stable identity are preserved; author code no longer owns signal persistence identity.',
            '8. **Public export cleanup — ECDD-225.** Remove v1-only authoring/runtime exports; no compatibility layer is required.': '8. **Public export cleanup — ECDD-225 (complete).** PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0` leaves the package root v2-only, keeps host/runtime mechanisms internal, and adds no compatibility layer.',
            '- Legacy/array authoring exports and documentation that would force compatibility constraints onto v2.': '- Legacy/array authoring exports that would force compatibility constraints onto v2 (public-surface cleanup completed by ECDD-225; authoring-document rewrite remains ECDD-226).',
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'Expected one current-state match for: {old!r}; got {text.count(old)}')
            text = text.replace(old, new)
          current.write_text(text, encoding='utf-8')

          plan = Path('docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md')
          text = plan.read_text(encoding='utf-8')
          old = '- [ ] Phase 15 — Remove v1-only authoring/runtime surface'
          new = '- [x] Phase 15 — Remove v1-only authoring/runtime surface'
          if text.count(old) != 1:
            raise SystemExit(f'Expected one Phase 15 row; got {text.count(old)}')
          text = text.replace(old, new)
          old = 'ECDD-225 (v1-only public export cleanup) is the next SDK-v2 optimization task.'
          new = 'ECDD-225 completed the v1-only public authoring/runtime export cleanup via PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0`, leaving a v2-only author root while keeping required host/runtime mechanisms internal. ECDD-226 (final v2 authoring documentation) is the next SDK-v2 optimization task.'
          if text.count(old) != 1:
            raise SystemExit(f'Expected one sequencing sentence; got {text.count(old)}')
          text = text.replace(old, new)
          start = text.index('### Task 18: Remove SDK v1-only authoring/runtime code')
          end = text.index('\n---', start)
          section = text[start:end]
          section = section.replace('- [ ]', '- [x]')
          marker = '**Interfaces:**\n\n- SDK v2 is the only supported indicator authoring model.\n'
          addition = marker + '\n**Completion:** ECDD-225 completed via PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0`; the public package root is v2-only, required host/runtime mechanisms remain internal, maintained indicators/fixtures use the final optimization surface, and no legacy compatibility path was added.\n'
          if section.count(marker) != 1:
            raise SystemExit(f'Expected Task 18 interface marker once; got {section.count(marker)}')
          section = section.replace(marker, addition)
          text = text[:start] + section + text[end:]
          plan.write_text(text, encoding='utf-8')
          PY
      - name: Format reassessment docs
        run: npx prettier --write docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
      - name: Commit reassessment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'docs(ECDD-225): record SDK v2 export cleanup'
          git push origin HEAD:task/ECDD-225-post-task-docs
