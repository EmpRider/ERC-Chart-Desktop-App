name: ECDD-228 post-task docs

on:
  push:
    branches:
      - task/ECDD-228-post-task-docs

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-228-post-task-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts --audit=false
      - name: Apply ECDD-228 reassessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current = Path('docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md')
          text = current.read_text()
          replacements = {
              'Complete (ECDD-227); ECDD-228 next': 'Complete (ECDD-227); ECDD-228 regression coverage complete',
              'ECDD-224 complete: the maintained ATR Rope/UT Bot implementation is migrated to the v2 authoring/runtime primitives with four compiled-package semantic regression configurations preserved.': 'ECDD-224 completed the maintained ATR Rope/UT Bot migration. ECDD-228 now completes the broader migration-regression matrix across approved semantic fixtures, historical replay, provisional replacement, finalized advancement, and unrelated authoring source reorder.',
              'Complete (ECDD-224); regression depth remains ECDD-228': 'Complete (ECDD-224, ECDD-228)',
              'ECDD-227 complete via PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce`. ECDD-228 owns maintained ATR Rope/UT Bot migration-regression depth; provider/MTF source acceptance remains with ECDD-142.': 'ECDD-227 completed the composed v2 contract fixture. ECDD-228 completes the maintained ATR Rope/UT Bot regression matrix via PR #139 / squash merge `cdd7db5568fb89f9415b7db526340d265aada5d0`; provider/MTF source acceptance remains with ECDD-142.',
              'Complete (ECDD-227); ECDD-228, ECDD-142 boundary': 'Complete (ECDD-227, ECDD-228); ECDD-142 boundary',
              '11. **Migration regressions — ECDD-228.** Prove rewritten ATR Rope/UT Bot outputs remain correct on equivalent candles.': '11. **Migration regressions — ECDD-228 (complete).** PR #139 / squash merge `cdd7db5568fb89f9415b7db526340d265aada5d0` proves the approved ATR Rope/UT Bot semantics across historical replay, provisional replacement, finalized advancement, and unrelated authoring source reorder.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'current-state replacement count {count}: {old}')
              text = text.replace(old, new)
          current.write_text(text)

          plan = Path('docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md')
          text = plan.read_text()
          old = 'ECDD-228 (ATR Rope/UT Bot migration regression expansion) is the next SDK-v2 optimization task. Phase 16 remains open until ECDD-228 and ECDD-229 acceptance work is complete.'
          new = 'ECDD-228 completed the ATR Rope/UT Bot migration-regression expansion via PR #139 / squash merge `cdd7db5568fb89f9415b7db526340d265aada5d0`, proving approved semantics through historical replay, provisional replacement, finalized advancement, and unrelated authoring source reorder. ECDD-229 (authored-indicator performance acceptance) is the next SDK-v2 optimization task. Phase 16 remains open until ECDD-229 acceptance work is complete.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'plan replacement count {count}')
          plan.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
      - name: Commit reassessment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record ECDD-228 SDK v2 reassessment"
          git push origin HEAD:task/ECDD-228-post-task-docs
