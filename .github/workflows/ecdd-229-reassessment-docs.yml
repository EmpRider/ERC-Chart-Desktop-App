name: ECDD-229 post-task reassessment docs

on:
  push:
    branches:
      - task/ECDD-229-post-task-reassessment

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ECDD-229-post-task-reassessment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts --audit=false
      - name: Reconcile ECDD-229 SDK v2 records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          current = Path('docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md')
          text = current.read_text(encoding='utf-8')
          lines = text.splitlines()
          replaced = False
          for index, line in enumerate(lines):
              if line.startswith('| Performance gates'):
                  lines[index] = '| Performance gates           | `npm run test:performance` now includes the production-orchestration ECDD-229 gate: four independent headless chart owners are reconciled through `reconcilePluginIndicators`, supervised by `createBrowserIndicatorRuntime`, and execute the compiled maintained ATR Rope/UT Bot package in four isolated production `worker-entry` workers. Existing large-history, structured-series, drawing and tick budgets remain enforced. | ECDD-229 closes the optimization-scope performance gap with deterministic history, provisional, finalized-rollover and multi-chart runtime/orchestration budgets. This is intentionally not a renderer-pixel-FPS or provider/network-latency claim; provider-aware MTF acquisition/per-TA execution remains ECDD-142 scope. | Complete (ECDD-229, PR #141 / `5bc8b1f23cb7a82c04c7620dbe414dc3f4c8bafe`); ECDD-142 owns provider/MTF acceptance |'
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('Performance gates row not found')

          old_gap = '12. **Performance gates — ECDD-229.** Retain current component budgets and add large-history, live/provisional, finalized, and real multi-chart live-update gates without duplicating provider-aware MTF acquisition.'
          new_gap = '12. **Performance gates — ECDD-229 (complete).** PR #141 / squash merge `5bc8b1f23cb7a82c04c7620dbe414dc3f4c8bafe` retains the existing component budgets and adds production chart-scoped, four-worker large-history, provisional, finalized-rollover, and real multi-chart runtime/orchestration acceptance without duplicating provider-aware MTF acquisition.'
          joined = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          if old_gap not in joined:
              raise SystemExit('ECDD-229 gap-classification entry not found')
          joined = joined.replace(old_gap, new_gap, 1)
          current.write_text(joined, encoding='utf-8')

          plan = Path('docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md')
          text = plan.read_text(encoding='utf-8')
          old_note = ('**Optimization sequencing note (2026-09-13):** ECDD-222 maps to detailed Task 7 and is complete. ECDD-223 maps to detailed Task 8 and is complete via PR #129 / squash merge `de7262ea3723530d546df017c2ac2eed14f9250f`. ECDD-224 completed the maintained ATR Rope/UT Bot rewrite via PR #131 / squash merge `e8c94027e40e0a24be1070a588ca93b097220687`, preserving the four compiled-package trading-semantic regression configurations while moving runtime plumbing to SDK v2. ECDD-225 completed the v1-only public authoring/runtime export cleanup via PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0`, leaving a v2-only author root while keeping required host/runtime mechanisms internal. ECDD-226 completed the final v2-only authoring guide via PR #135 / squash merge `a4ece67f7b9aa077108fd27e777b6c1b92374ae3`, with provider-aware MTF/per-TA execution explicitly retained under ECDD-142 ownership. ECDD-227 completed the final composed v2 contract fixture via PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce`, covering hidden identity, conditional execution, history syntax parity, provisional rollback, finalized advancement, drawing reconciliation, and stable finalized signal identity through the packaged authoring path. ECDD-228 completed the ATR Rope/UT Bot migration-regression expansion via PR #139 / squash merge `cdd7db5568fb89f9415b7db526340d265aada5d0`, proving approved semantics through historical replay, provisional replacement, finalized advancement, and unrelated authoring source reorder. ECDD-229 (authored-indicator performance acceptance) is the next SDK-v2 optimization task. Phase 16 remains open until ECDD-229 acceptance work is complete. The broader phase board groups source/runtime/renderer work at architecture level and does not override the ECDD-216 Jira task order.')
          new_note = ('**Optimization sequencing note (2026-09-13):** ECDD-222 maps to detailed Task 7 and is complete. ECDD-223 maps to detailed Task 8 and is complete via PR #129 / squash merge `de7262ea3723530d546df017c2ac2eed14f9250f`. ECDD-224 completed the maintained ATR Rope/UT Bot rewrite via PR #131 / squash merge `e8c94027e40e0a24be1070a588ca93b097220687`, preserving the four compiled-package trading-semantic regression configurations while moving runtime plumbing to SDK v2. ECDD-225 completed the v1-only public authoring/runtime export cleanup via PR #133 / squash merge `8b9fd709070bb884295813a07a6fdfa11c4efaf0`, leaving a v2-only author root while keeping required host/runtime mechanisms internal. ECDD-226 completed the final v2-only authoring guide via PR #135 / squash merge `a4ece67f7b9aa077108fd27e777b6c1b92374ae3`, with provider-aware MTF/per-TA execution explicitly retained under ECDD-142 ownership. ECDD-227 completed the final composed v2 contract fixture via PR #137 / squash merge `8bdbb38b98b1f74220966a26c170f88476e54cce`, covering hidden identity, conditional execution, history syntax parity, provisional rollback, finalized advancement, drawing reconciliation, and stable finalized signal identity through the packaged authoring path. ECDD-228 completed the ATR Rope/UT Bot migration-regression expansion via PR #139 / squash merge `cdd7db5568fb89f9415b7db526340d265aada5d0`, proving approved semantics through historical replay, provisional replacement, finalized advancement, and unrelated authoring source reorder. ECDD-229 completed the authored-indicator performance acceptance via PR #141 / squash merge `5bc8b1f23cb7a82c04c7620dbe414dc3f4c8bafe`, adding production chart-scoped/four-worker history, provisional and finalized-rollover budgets to the enforced `test:performance` path. This closes the ECDD-216 optimization performance slice. Phase 16 remains open at architecture level only for the broader provider-aware MTF/source-engine/lookahead/resource acceptance owned by ECDD-142; those ECDD-142 gates must not be marked complete from ECDD-229 evidence. The broader phase board groups source/runtime/renderer work at architecture level and does not override Jira ownership.')
          if old_note not in text:
              raise SystemExit('Optimization sequencing note not found')
          text = text.replace(old_note, new_note, 1)

          marker = '\n---\n\n## Direction Check for Every Review\n'
          entry = '''\n### 2026-09-13 — ECDD-229 authored-indicator performance acceptance completed\n\n- ECDD-229 was squash-merged into `epic/ECDD-135-sdk-v2-optimization` as `5bc8b1f23cb7a82c04c7620dbe414dc3f4c8bafe` via PR #141.\n- The enforced `npm run test:performance` path now drives four independent chart owners through production `reconcilePluginIndicators`, `createBrowserIndicatorRuntime`, four isolated workers executing the production `worker-entry`, and the compiled maintained ATR Rope/UT Bot package.\n- Ready-state Delivery #1050 passed governance, formatting, lint, typecheck, unit, 148 integration tests, Electron smokes, build, the strengthened performance suite, audit, version checks and aggregate delivery on final head `84730d2a29fc6222bc38c4e298b45cbceab92c5c`; Semgrep also passed with zero annotations.\n- Delivery #1047 measured 100,000 aggregate history bars across four workers in about 14.25 seconds, 1,000 provisional updates in about 327 ms total, and the four-chart finalized rollover sweep in about 5.16 ms, all inside the documented CI budgets.\n- No production SDK/runtime source was changed by ECDD-229; the task closes regression acceptance around the existing production orchestration path.\n- Post-task reassessment confirms the ECDD-216 optimization performance slice is complete and still aligned with the v2 design. Provider-aware MTF acquisition, per-TA timeframe execution, source sharing, lookahead matrices, and provider/source resource acceptance remain ECDD-142-owned work and therefore keep the global Phase 16 acceptance board open.\n'''
          if marker not in text:
              raise SystemExit('Status-log insertion marker not found')
          if '### 2026-09-13 — ECDD-229 authored-indicator performance acceptance completed' not in text:
              text = text.replace(marker, entry + marker, 1)
          plan.write_text(text, encoding='utf-8')
          PY
      - run: npx prettier --write docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
      - name: Commit reassessment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/INDICATOR-SDK-V2-CURRENT-STATE.md docs/superpowers/plans/2026-09-09-indicator-sdk-v2-redesign-implementation.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record ECDD-229 SDK v2 reassessment"
          git push origin HEAD:task/ECDD-229-post-task-reassessment
